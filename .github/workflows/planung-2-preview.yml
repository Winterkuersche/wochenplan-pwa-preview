name: Planung 2 Preview

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planung-2-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Planung 2
        uses: actions/checkout@v4
        with:
          repository: Winterkuersche/wochenplan-pwa
          ref: planung-2-interaktiv
          path: source

      - name: Update fixed preview
        run: |
          mkdir -p planung-2
          rsync --archive --delete \
            --exclude='.git' \
            --exclude='.github/' \
            source/ planung-2/
          cp planung-2/planung2-preview.html planung-2/index.html
          rm -rf source

          python3 - <<'PY'
          from pathlib import Path
          path = Path('planung-2/index.html')
          text = path.read_text()
          marker = '<script src="./holidays.js"></script>'
          diagnostic = '''<script>
          window.addEventListener('error', function (event) {
            const id = 'previewRuntimeError';
            let box = document.getElementById(id);
            if (!box) {
              box = document.createElement('div');
              box.id = id;
              box.style.cssText = 'margin:10px;padding:10px;border:1px solid #b42318;border-radius:10px;background:#3a1717;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap';
              const app = document.querySelector('.app');
              if (app) app.prepend(box);
            }
            box.textContent = 'JS-Fehler: ' + (event.message || 'unbekannt') + '\\n' + (event.filename || '') + ':' + (event.lineno || '') + ':' + (event.colno || '');
          });
          </script>\n'''
          if marker in text and 'previewRuntimeError' not in text:
              text = text.replace(marker, diagnostic + marker, 1)
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planung-2
          git diff --cached --quiet && exit 0
          git commit -m "Update Planung 2 preview"

          git fetch origin main
          git rebase origin/main
          git push origin main
